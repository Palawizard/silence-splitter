name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress --yes
      - run: npm ci
      - run: npm run icons
      - run: npm run fixtures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
