name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress --yes
      - run: npm ci
      - run: npm run fixtures
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Publish prerelease assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release create "v$version" `
            "dist/Silence-Splitter-$version-x64-setup.exe" `
            "dist/Silence-Splitter-$version-x64-setup.exe.blockmap" `
            "dist/latest.yml" `
            --repo "${{ github.repository }}" `
            --target main `
            --title "$version" `
            --generate-notes `
            --prerelease
