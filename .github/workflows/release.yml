name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: choco install ffmpeg --no-progress --yes
      - run: npm ci
      - run: npm run fixtures
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match package version $version"
          }
      - name: Verify release notes exist
        shell: pwsh
        run: |
          $notesPath = ".github/release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $notesPath)) {
            throw "Release notes file not found: $notesPath. Add it before tagging."
          }
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Silence Splitter - ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            dist/Silence-Splitter-*-x64-setup.exe
            dist/Silence-Splitter-*-x64-setup.exe.blockmap
            dist/latest.yml
          prerelease: false
          fail_on_unmatched_files: true
